name: Find missing ARTIZONE builder blobs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    if: github.head_ref == 'artizone-builder-sync-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all repository history
        uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
          fetch-depth: 0

      - name: Compare builder blob manifest with GitHub objects
        run: |
          set -euo pipefail
          cat .sync/manifest-parts/*.b64 | base64 -d | gzip -dc > /tmp/builder-blobs.txt
          test "$(wc -l < /tmp/builder-blobs.txt)" -eq 957
          : > .sync/missing-builder-blobs.txt
          total=0
          present=0
          missing=0
          missing_bytes=0
          while read -r sha size; do
            total=$((total + 1))
            if git cat-file -e "${sha}^{blob}" 2>/dev/null; then
              present=$((present + 1))
            else
              printf '%s %s\n' "$sha" "$size" >> .sync/missing-builder-blobs.txt
              missing=$((missing + 1))
              missing_bytes=$((missing_bytes + size))
            fi
          done < /tmp/builder-blobs.txt
          {
            echo "TOTAL_BUILDER_BLOBS=$total"
            echo "PRESENT_IN_GITHUB=$present"
            echo "MISSING_FROM_GITHUB=$missing"
            echo "MISSING_BYTES=$missing_bytes"
          } > .sync/missing-builder-summary.txt
          cat .sync/missing-builder-summary.txt
          git config user.name 'ARTIZONE Builder Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add .sync/missing-builder-blobs.txt .sync/missing-builder-summary.txt
          if git diff --cached --quiet; then
            echo 'Missing-object report unchanged.'
            exit 0
          fi
          git commit -m 'Report missing builder Git blobs'
          git push origin HEAD:artizone-builder-sync-2026-08-09
