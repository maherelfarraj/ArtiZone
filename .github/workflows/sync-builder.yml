name: Sync ARTIZONE builder snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'artizone-builder-sync-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
          fetch-depth: 0

      - name: Verify uploaded builder bundle
        run: |
          test -f artizone-builder-sync-2026-08-09.bundle
          echo "1edcbf426a1a05ec45dca8657e9278950bbe13186c3f2a61197337c8440f7752  artizone-builder-sync-2026-08-09.bundle" | sha256sum -c -
          git bundle verify artizone-builder-sync-2026-08-09.bundle

      - name: Extract builder snapshot
        run: |
          rm -rf /tmp/artizone-builder
          git clone artizone-builder-sync-2026-08-09.bundle /tmp/artizone-builder || true
          cd /tmp/artizone-builder
          git checkout -B artizone-builder-sync-2026-08-09 origin/artizone-builder-sync-2026-08-09
          test "$(git rev-parse HEAD)" = "22a00dd33243a6d99726e7d8193fa23cb322aefc"

      - name: Replace branch working tree with verified builder snapshot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='public/artizone-builder-sync-2026-08-09.bundle' \
            --exclude='.github/workflows/sync-builder.yml' \
            /tmp/artizone-builder/ ./
          rm -f artizone-builder-sync-2026-08-09.bundle
          rm -f public/artizone-builder-sync-2026-08-09.bundle
          rm -f .github/workflows/sync-builder.yml

      - name: Commit synchronized snapshot
        run: |
          git config user.name "ARTIZONE Builder Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync ARTIZONE builder loyalty catalog and admin updates"
          git push origin HEAD:artizone-builder-sync-2026-08-09
