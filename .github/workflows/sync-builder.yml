name: Sync ARTIZONE builder snapshot

on:
  push:
    branches:
      - artizone-builder-sync-2026-08-09
    paths:
      - .github/workflows/sync-builder.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
          fetch-depth: 0

      - name: Download verified builder bundle
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://artizonespa.com/artizone-builder-sync-2026-08-09.bundle \
            -o /tmp/artizone-builder.bundle
          git bundle verify /tmp/artizone-builder.bundle

      - name: Extract builder snapshot
        run: |
          rm -rf /tmp/artizone-builder
          git clone /tmp/artizone-builder.bundle /tmp/artizone-builder || true
          cd /tmp/artizone-builder
          git checkout -B artizone-builder-sync-2026-08-09 origin/artizone-builder-sync-2026-08-09
          test "$(git rev-parse HEAD)" = "22a00dd33243a6d99726e7d8193fa23cb322aefc"

      - name: Replace branch working tree with builder snapshot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='public/artizone-builder-sync-2026-08-09.bundle' \
            --exclude='.github/workflows/sync-builder.yml' \
            /tmp/artizone-builder/ ./
          rm -f public/artizone-builder-sync-2026-08-09.bundle

      - name: Commit synchronized snapshot
        run: |
          git config user.name "ARTIZONE Builder Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync ARTIZONE builder loyalty catalog and admin updates"
          git push origin HEAD:artizone-builder-sync-2026-08-09
