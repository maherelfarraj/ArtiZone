name: Diagnose ARTIZONE patch chunks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'artizone-builder-sync-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync staging branch
        uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
          fetch-depth: 0
      - name: Report patch chunk identities
        run: |
          set -euo pipefail
          for f in .sync/patch-parts/*.b64; do
            printf '%s %s %s\n' "$(basename "$f")" "$(wc -c < "$f")" "$(git hash-object "$f")"
          done
          cat .sync/patch-parts/*.b64 > /tmp/builder_sync.patch.gz.b64
          sha256sum /tmp/builder_sync.patch.gz.b64
          base64 -d /tmp/builder_sync.patch.gz.b64 | gzip -dc > /tmp/builder_sync.patch
          sha256sum /tmp/builder_sync.patch
          wc -c /tmp/builder_sync.patch
