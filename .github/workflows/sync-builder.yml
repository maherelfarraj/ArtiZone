name: ARTIZONE exact chunk 010 assembly

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble-chunk-010:
    if: ${{ github.head_ref == 'artizone-builder-sync-2026-08-09' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
      - name: Verify fragments and assemble exact chunk 010
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          010.00 c2c58c06285f7de64ac104e828f8344e4ce863cc
          010.01 e0446afec43dd2fdc3ee1858d39614ec6155284e
          010.02 03e31f123c9eaa33894b058228d5474a2ad48bed
          010.03 5898fd3c8da49d3c732695b7ec1b03cc9167d14c
          010.04 bd3dabfb8d4ba8a529bb2981b598b88d35d840fb
          010.05 9037fe344eae2915a59b7703dc4af64b57eea299
          EOF
          while read -r name expected; do
            path=".sync/payload4k24/${name}.b64"
            test "$(wc -c < "$path")" -eq 4000
            test "$(git hash-object "$path")" = "$expected"
          done < /tmp/expected.tsv
          cat .sync/payload4k24/010.00.b64 .sync/payload4k24/010.01.b64 .sync/payload4k24/010.02.b64 .sync/payload4k24/010.03.b64 .sync/payload4k24/010.04.b64 .sync/payload4k24/010.05.b64 > .sync/payload20k/010.b64
          test "$(wc -c < .sync/payload20k/010.b64)" -eq 24000
          echo '9a63c5baad516b1766b34db9ee7dce73bf06c362a6eaee3525acc7c3c0aa888f  .sync/payload20k/010.b64' | sha256sum -c -
          test "$(git hash-object .sync/payload20k/010.b64)" = 'ccaa82feb1c92c0f1701360175cfaa0ea8d0083b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/payload20k/010.b64
          if git diff --cached --quiet; then
            echo 'Chunk 010 already exact; nothing to commit.'
            exit 0
          fi
          git commit -m 'Assemble exact builder payload chunk 010'
          git push origin HEAD:artizone-builder-sync-2026-08-09
