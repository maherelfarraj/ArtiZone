name: ARTIZONE builder payload validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-chunk-009:
    if: ${{ github.head_ref == 'artizone-builder-sync-2026-08-09' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact chunk 009 aggregate
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/009.b64
          for i in $(seq -w 0 11); do
            f=".sync/payload4k/009.${i}.b64"
            test "$(wc -c < "$f")" -eq 4000
            cat "$f" >> /tmp/009.b64
          done
          for f in \
            .sync/payload12k/009.12-14.b64 \
            .sync/payload12k/009.15-17.b64 \
            .sync/payload12k/009.18-20.b64 \
            .sync/payload12k/009.21-23.b64 \
            .sync/payload12k/009.24-26.b64 \
            .sync/payload12k/009.27-29.b64
          do
            test "$(wc -c < "$f")" -eq 12000
            cat "$f" >> /tmp/009.b64
          done
          test "$(wc -c < /tmp/009.b64)" -eq 120000
          echo '60acb6cfb3e9e42644c7ae8ec2041624414588752cc1f02984f22f95607fb1f4  /tmp/009.b64' | sha256sum -c -
          echo 'Chunk 009 exact-byte verification passed.'
