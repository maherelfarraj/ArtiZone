name: ARTIZONE exact chunk 014 assembly

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble-chunk-014:
    if: ${{ github.head_ref == 'artizone-builder-sync-2026-08-09' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
      - name: Verify fragments and assemble exact chunk 014
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          014.00 6fc8372b97c1bc03177773929a9413b507dac057
          014.01 2f465bdd00a115ec8b968dfb8558af4d596721ca
          014.02 8cbdaa851bb63c71fb876eca996c017065d1b639
          014.03 c0cbfdb5dfc379531bdc519e1b6225984601509d
          014.04 f3a211a422823d8117ed8d73e8f5ed98a62c408b
          014.05 2d8771a525912f8e59d96e0abe8c4964b15a48a6
          EOF
          while read -r name expected; do
            path=".sync/payload4k24/${name}.b64"
            test "$(wc -c < "$path")" -eq 4000
            test "$(git hash-object "$path")" = "$expected"
          done < /tmp/expected.tsv
          cat .sync/payload4k24/014.00.b64 .sync/payload4k24/014.01.b64 .sync/payload4k24/014.02.b64 .sync/payload4k24/014.03.b64 .sync/payload4k24/014.04.b64 .sync/payload4k24/014.05.b64 > .sync/payload20k/014.b64
          test "$(wc -c < .sync/payload20k/014.b64)" -eq 24000
          echo 'ae927515206787498d18385ac76f2c1a2a78fa105cbfdd7403e5f452721668f0  .sync/payload20k/014.b64' | sha256sum -c -
          test "$(git hash-object .sync/payload20k/014.b64)" = '9f0fdcb263d9f5aa8fd3244c1d9d9f6cfa314154'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/payload20k/014.b64
          if git diff --cached --quiet; then
            echo 'Chunk 014 already exact; nothing to commit.'
            exit 0
          fi
          git commit -m 'Assemble exact builder payload chunk 014'
          git push origin HEAD:artizone-builder-sync-2026-08-09
