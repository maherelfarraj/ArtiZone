name: ARTIZONE exact chunk 015 assembly

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble-chunk-015:
    if: ${{ github.head_ref == 'artizone-builder-sync-2026-08-09' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
      - name: Verify fragments and assemble exact chunk 015
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          015.00 13b6ec83115402521f05c3d762804b4a2cfb934c
          015.01 03fd1b06bec926e9dad3734beb21bd8a78d63404
          015.02 6e4648d99927eecce82b0ca3e7fc15e887acac8a
          015.03 48ef8e0e6a214a175e47ce88d1c5ee9ac4510485
          015.04 a1ab469a571154b69ca77250d966a9fabcaf481f
          015.05 5693c9ee9bcde6b74ecbed38f13a07bcb9f41fdc
          EOF
          while read -r name expected; do
            path=".sync/payload4k24/${name}.b64"
            test "$(wc -c < "$path")" -eq 4000
            test "$(git hash-object "$path")" = "$expected"
          done < /tmp/expected.tsv
          cat .sync/payload4k24/015.00.b64 .sync/payload4k24/015.01.b64 .sync/payload4k24/015.02.b64 .sync/payload4k24/015.03.b64 .sync/payload4k24/015.04.b64 .sync/payload4k24/015.05.b64 > .sync/payload20k/015.b64
          test "$(wc -c < .sync/payload20k/015.b64)" -eq 24000
          echo 'cdd0ddc2498ced353416edcbaf199e31537e3770f3669e212c92527929078c95  .sync/payload20k/015.b64' | sha256sum -c -
          test "$(git hash-object .sync/payload20k/015.b64)" = '2468b03dbc978ba302b13b964c145a6ebc9c4bb7'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/payload20k/015.b64
          if git diff --cached --quiet; then
            echo 'Chunk 015 already exact; nothing to commit.'
            exit 0
          fi
          git commit -m 'Assemble exact builder payload chunk 015'
          git push origin HEAD:artizone-builder-sync-2026-08-09
