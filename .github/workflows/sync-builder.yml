name: Inventory GitHub objects for ARTIZONE sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    if: github.head_ref == 'artizone-builder-sync-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all repository history
        uses: actions/checkout@v4
        with:
          ref: artizone-builder-sync-2026-08-09
          fetch-depth: 0

      - name: Generate repository object inventory
        run: |
          set -euo pipefail
          mkdir -p .sync
          git cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype) %(objectsize)' | sort > .sync/github-object-inventory.txt
          git ls-tree -r origin/main > .sync/main-tree.txt
          git config user.name 'ARTIZONE Builder Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add .sync/github-object-inventory.txt .sync/main-tree.txt
          git commit -m 'Add temporary Git object inventory for builder sync'
          git push origin HEAD:artizone-builder-sync-2026-08-09
