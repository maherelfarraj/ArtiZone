name: Inspect Airo bundle access

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'artizone-builder-sync-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect preview response headers
        run: |
          set -u
          echo '--- PREVIEW ---'
          curl -sS -D - -o /dev/null 'https://3jp2cftx2f.preview.c24.airoapp.ai/artizone-builder-sync-2026-08-09.bundle' || true
          echo '--- LIVE ---'
          curl -sS -D - -o /dev/null 'https://artizonespa.com/artizone-builder-sync-2026-08-09.bundle' || true
