name: ARTIZONE builder payload validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-chunk-008:
    if: ${{ github.head_ref == 'artizone-builder-sync-2026-08-09' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact chunk 008
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(printf '%s\n' .sync/payload4k/008.*.b64 | sort)
          test "${#parts[@]}" -eq 30
          for part in "${parts[@]}"; do
            test "$(wc -c < "$part")" -eq 4000
          done
          cat "${parts[@]}" > /tmp/008.b64
          test "$(wc -c < /tmp/008.b64)" -eq 120000
          echo '35a195cc0004508946d589c17a6c24f02a005aeca496366991de7e0e36ad78e4  /tmp/008.b64' | sha256sum -c -
          echo 'Chunk 008 exact-byte verification passed.'
